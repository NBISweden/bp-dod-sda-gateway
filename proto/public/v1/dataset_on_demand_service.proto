syntax = "proto3";
package dataset_on_demand;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/NBISweden/bp-dod-sda-gateway/grpc_gen/go/public/v1";

// All RPCs on the DatasetOnDemandService require a bearer token supplied in the
// Authorization header:
//   Authorization: Bearer <token>
//
// Requests without a valid token are rejected with
// UNAUTHENTICATED.
service DatasetOnDemandService {
  rpc RequestDatasetCreation(RequestDatasetCreationRequest) returns (RequestDatasetCreationResponse);
  rpc GetOnDemandDatasetStatus(GetOnDemandDatasetStatusRequest) returns (GetOnDemandDatasetStatusResponse);
  rpc ListMyOnDemandDatasets(ListMyOnDemandDatasetsRequest) returns (ListMyOnDemandDatasetsResponse);
}

message RequestDatasetCreationRequest {
  // The accession id of the images to request to combine into a dataset
  repeated string image_accessions = 1;
  // Optional: A user specific description of the dataset
  // For example the query which resulted in the requested images.
  // Main purpose is just for the user to be able to differentiate the datasets in the ListMyOnDemandDatasets response
  string label = 2;
}
message RequestDatasetCreationResponse {
  string on_demand_dataset_accession = 1;
}
message GetOnDemandDatasetStatusRequest {
  string on_demand_dataset_accession = 1;
}
message GetOnDemandDatasetStatusResponse {
  OnDemandDataset.Status status = 1;
}

message OnDemandDataset {
  enum Status {
    STATUS_INVALID = 0;
    STATUS_CREATING = 1;
    STATUS_RELEASED = 2;
  }
  string accession = 1;
  Status status = 2;
  google.protobuf.Timestamp requested_at = 3;
  string label = 4;
}

message ListMyOnDemandDatasetsRequest{
}
message ListMyOnDemandDatasetsResponse{
  repeated OnDemandDataset on_demand_datasets = 1;
}



